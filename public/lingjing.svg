<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="lj-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E3A5C"/>
      <stop offset="55%" stop-color="#2A1F62"/>
      <stop offset="100%" stop-color="#4A2E6C"/>
    </linearGradient>
    <radialGradient id="lj-glow" cx="28%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#5FCFE8" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#5FCFE8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lj-char" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CDE6FF"/>
    </linearGradient>
  </defs>

  <!-- 渐变底 + 顶左光晕 -->
  <rect width="64" height="64" rx="14" fill="url(#lj-bg)"/>
  <rect width="64" height="64" rx="14" fill="url(#lj-glow)"/>

  <!-- 灵气点缀（四角小星粒） -->
  <circle cx="12" cy="14" r=".8" fill="#A6E1F4" opacity=".75"/>
  <circle cx="54" cy="18" r="1.1" fill="#C9B8FF" opacity=".7"/>
  <circle cx="50" cy="48" r=".7" fill="#E8F4FF" opacity=".8"/>
  <circle cx="10" cy="48" r=".9" fill="#FBC8FF" opacity=".55"/>

  <!-- 主体：灵 字 -->
  <text x="32" y="46" text-anchor="middle"
        font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Source Han Sans SC',-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="36" font-weight="500"
        fill="url(#lj-char)">灵</text>
</svg>
